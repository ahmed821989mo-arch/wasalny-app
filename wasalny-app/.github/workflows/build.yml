name: Build Wasalny Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasalny-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure and validate Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            decoded_json="$(mktemp)"
            if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > "$decoded_json" 2>/dev/null && \
              python3 -c 'import json, sys; json.load(open(sys.argv[1]))' "$decoded_json" >/dev/null 2>&1; then
              cp "$decoded_json" app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            fi
            rm -f "$decoded_json"
          fi
          test -s app/google-services.json || {
            echo "::error::Provide GOOGLE_SERVICES_JSON as Base64 or commit app/google-services.json."
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if project_id != "wasalny-app-f5dbb" or "com.wasalny.sidisalem" not in package_names:
              raise SystemExit("google-services.json does not match the Wasalny Firebase project and package.")
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasalny-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
