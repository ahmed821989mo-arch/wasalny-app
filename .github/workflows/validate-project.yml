name: Validate Wasalny project

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:rules

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          elif [ ! -s app/google-services.json ]; then
            echo "app/google-services.json is required for a clean Android build."
            exit 1
          fi
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --no-daemon
