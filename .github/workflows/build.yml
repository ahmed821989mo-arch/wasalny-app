name: Build Wasalny Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasalny-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure and validate Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          test -s app/google-services.json || {
            echo "::error::Provide GOOGLE_SERVICES_JSON as Base64 or commit app/google-services.json."
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if project_id != "wasalny-app-f5dbb" or "com.wasalny.sidisalem" not in package_names:
              raise SystemExit("google-services.json does not match the Wasalny Firebase project and package.")
          PY

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required GitHub Actions secret ${secret_name} is missing."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value):
              return (value.replace("\\", "\\\\").replace("\n", "\\n")
                      .replace("\r", "\\r").replace("\t", "\\t")
                      .replace(" ", "\\ ").replace(":", "\\:").replace("=", "\\="))

          values = {
              "storeFile": "release-keystore.jks",
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          path = Path("keystore.properties")
          path.write_text("".join(f"{key}={escape_property(value)}\n" for key, value in values.items()))
          path.chmod(0o600)
          PY

      - name: Build signed APK and Play Store bundle
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wasalny-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: rm -f release-keystore.jks keystore.properties
